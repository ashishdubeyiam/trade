{% extends "base.html" %}

{% block title %}Upload Transaction Data{% endblock %}

{% block content %}
<h1>Upload Transaction Data for Fraud Detection</h1>

<form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data" style="margin-top: 20px;">
    <div style="margin-bottom: 15px;">
        <label for="datafile" style="display: block; margin-bottom: 5px; font-weight: bold;">Select CSV File:</label>
        <input type="file" id="datafile" name="datafile" accept=".csv" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>
    <div>
        <input type="submit" value="Upload and Process" style="background-color: #5cb85c; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
    </div>
</form>
{% endblock %}

{% block styles %}
{{ super() }}
<style>
    /* Specific styles for index.html if any, otherwise base.html styles apply */
    /* The form styling is currently inline, which is fine for this scale. */
</style>
{% endblock %}
